<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sổ Tay Số WebGIS - Y Tế & Du Lịch Đà Nẵng</title>
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f4f6f9;
        }

        /* Header Navigation */
        header {
            background-color: #0d47a1;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        header h1 {
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Emergency SOS Button */
        .btn-sos {
            background-color: #d32f2f;
            color: white;
            padding: 10px 18px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 12px rgba(211, 47, 47, 0.6);
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Main Container Layout */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar Filters & Location List */
        .sidebar {
            width: 360px;
            background: white;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            z-index: 900;
            overflow-y: auto;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .filter-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid #0d47a1;
            background: white;
            color: #0d47a1;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background: #0d47a1;
            color: white;
        }

        .location-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .location-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px;
            background: #fafafa;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .location-card:hover {
            border-color: #0d47a1;
            background: #f0f4f9;
        }

        .location-card h3 {
            font-size: 1rem;
            color: #1a237e;
            margin-bottom: 4px;
        }

        .location-card p {
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 2px;
        }

        .tag {
            display: inline-block;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 4px;
        }

        .tag-medical { background: #ffebee; color: #c62828; }
        .tag-tourism { background: #e8f5e9; color: #2e7d32; }

        /* Map Area */
        #map {
            flex: 1;
            height: 100%;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                flex-direction: column-reverse;
            }
            .sidebar {
                width: 100%;
                height: 40%;
            }
            #map {
                height: 60%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🚑 WebGIS Sổ Tay Y Tế & Du Lịch Đà Nẵng</h1>
        <a href="tel:115" class="btn-sos">🚨 CẤP CỨU 115</a>
    </header>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h3>Bộ Lọc Địa Điểm</h3>
            <div class="filter-group">
                <button class="filter-btn active" onclick="filterLocations('all')">Tất cả</button>
                <button class="filter-btn" onclick="filterLocations('Y tế')">🏥 Y tế</button>
                <button class="filter-btn" onclick="filterLocations('Du lịch')">🏨 Du lịch</button>
            </div>

            <div class="location-list" id="location-list">
                <!-- Danh sách điểm sẽ tự động xuất hiện ở đây -->
            </div>
        </div>

        <!-- WebGIS Map -->
        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Dữ liệu địa điểm WebGIS mẫu
        const locations = [
            {
                name: "Bệnh viện C Đà Nẵng",
                category: "Y tế",
                lat: 16.0681,
                lng: 108.2145,
                phone: "0236 3821 118",
                note: "Cấp cứu 24/7, có hỗ trợ lối đi xe lăn cho người cao tuổi"
            },
            {
                name: "Bệnh viện Đa khoa Đà Nẵng",
                category: "Y tế",
                lat: 16.0718,
                lng: 108.2132,
                phone: "0236 3821 115",
                note: "Trung tâm cấp cứu hàng đầu Đà Nẵng"
            },
            {
                name: "Furama Resort Đà Nẵng",
                category: "Du lịch",
                lat: 16.0392,
                lng: 108.2483,
                phone: "0236 3847 333",
                note: "Khu nghỉ dưỡng ven biển, đầy đủ tiện nghi hỗ trợ người cao tuổi"
            },
            {
                name: "Danh thắng Ngũ Hành Sơn",
                category: "Du lịch",
                lat: 16.0042,
                lng: 108.2633,
                phone: "0236 3961 114",
                note: "Có hệ thống thang máy cho người cao tuổi lên tham quan"
            }
        ];

        // 2. Khởi tạo bản đồ Leaflet trung tâm Đà Nẵng
        const map = L.map('map').setView([16.0544, 108.2022], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let markers = [];

        function displayLocations(data) {
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            const listContainer = document.getElementById('location-list');
            listContainer.innerHTML = '';

            data.forEach((loc) => {
                const marker = L.marker([loc.lat, loc.lng]).addTo(map);
                marker.bindPopup(`
                    <div style="font-size: 14px;">
                        <b style="color: #0d47a1;">${loc.name}</b><br>
                        <b>Loại:</b> ${loc.category}<br>
                        <b>SĐT:</b> <a href="tel:${loc.phone}">${loc.phone}</a><br>
                        <b>Ghi chú:</b> ${loc.note}
                    </div>
                `);
                markers.push(marker);

                const card = document.createElement('div');
                card.className = 'location-card';
                card.innerHTML = `
                    <h3>${loc.name}</h3>
                    <p><b>SĐT:</b> ${loc.phone}</p>
                    <p>${loc.note}</p>
                    <span class="tag ${loc.category === 'Y tế' ? 'tag-medical' : 'tag-tourism'}">${loc.category}</span>
                `;

                card.onclick = () => {
                    map.flyTo([loc.lat, loc.lng], 15);
                    marker.openPopup();
                };

                listContainer.appendChild(card);
            });
        }

        function filterLocations(cat) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (cat === 'all') {
                displayLocations(locations);
            } else {
                const filtered = locations.filter(l => l.category === cat);
                displayLocations(filtered);
            }
        }

        displayLocations(locations);
    </script>
</body>
</html>
